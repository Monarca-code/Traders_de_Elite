<!DOCTYPE html>

<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Redefinir senha — TRADERS DE ELITE"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>
        Redefinir Senha | TRADERS DE ELITE
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/portal.css"
    >

</head>

<body>

<div class="portal-background">

    <div class="grid"></div>

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>

</div>


<main class="auth-page">

    <section class="auth-card">


        <!-- LOGO -->

        <a
            href="../index.html"
            class="portal-logo"
        >

            <span
                class="brand-mark"
                aria-hidden="true"
            >

                <img
                    src="logo.png"
                    alt=""
                >

            </span>


            <span class="logo-text">

                <strong>

                    TRADERS DE<br>
                    ELITE

                </strong>


                <small>

                    PORTAL DO ESTUDANTE

                </small>

            </span>

        </a>


        <!-- CABEÇALHO -->

        <div class="auth-heading">

            <span class="section-label">

                SEGURANÇA

            </span>


            <h1>

                Nova senha<span>.</span>

            </h1>


            <p>

                Crie uma nova senha para voltar
                a acessar o seu portal.

            </p>

        </div>


        <!-- FORMULÁRIO -->

        <form
            id="resetPasswordForm"
            class="login-form"
        >


            <!-- NOVA SENHA -->

            <div class="input-group">

                <label for="password">

                    Nova senha

                </label>


                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite a nova senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Mostrar senha"
                    >

                        ◉

                    </button>

                </div>

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="input-group">

                <label for="passwordConfirm">

                    Confirmar senha

                </label>


                <div class="password-input">

                    <input
                        type="password"
                        id="passwordConfirm"
                        name="passwordConfirm"
                        placeholder="Digite novamente a senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        id="togglePasswordConfirm"
                        class="toggle-password"
                        aria-label="Mostrar senha"
                    >

                        ◉

                    </button>

                </div>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                id="resetButton"
                class="btn-login"
            >

                REDEFINIR SENHA

                <span>→</span>

            </button>


            <!-- MENSAGEM -->

            <p
                id="resetMessage"
                class="form-message"
                aria-live="polite"
            ></p>


        </form>


        <!-- VOLTAR -->

        <a
            href="login.html"
            class="back-link"
        >

            ← Voltar ao login

        </a>


    </section>


    <!-- RODAPÉ -->

    <footer class="auth-footer">

        <span>

            ©
            <span id="year"></span>
            TRADERS DE ELITE

        </span>


        <span>

            Angola

        </span>

    </footer>

</main>


<!-- APPWRITE -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17"></script>

<script src="../js/appwrite-config.js"></script>

<script src="js/redefinir-senha.js"></script>


</body>
</html>
