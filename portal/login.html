<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="Portal do Estudante — TRADERS DE ELITE"
>

<meta name="theme-color" content="#050505">

<title>Portal do Estudante | TRADERS DE ELITE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/portal.css">

</head>

<body>

<div class="portal-background">
    <div class="grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
</div>

<main class="auth-page">

    <section class="auth-card">

        <!-- LOGO -->

        <a href="../index.html" class="portal-logo">

            <span class="brand-mark" aria-hidden="true">
                <img src="logo.png" alt="">
            </span>

            <span class="logo-text">
                <strong>
                    TRADERS DE<br>
                    ELITE
                </strong>

                <small>
                    PORTAL DO ESTUDANTE
                </small>
            </span>

        </a>


        <!-- CABEÇALHO -->

        <div class="auth-heading">

            <span class="section-label">
                ÁREA RESERVADA
            </span>

            <h1>
                Bem-vindo<span>.</span>
            </h1>

            <p>
                Entre no seu portal para continuar
                a sua formação.
            </p>

        </div>


        <!-- FORMULÁRIO -->

        <form id="loginForm" class="login-form">

            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <div class="password-label">

                    <label for="password">
                        Senha
                    </label>

                    <a href="#" id="forgotPassword">
                        Esqueci a senha
                    </a>

                </div>

                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="A sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Mostrar senha"
                    >
                        ◉
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="btn-login"
            >
                ENTRAR NO PORTAL
                <span>→</span>
            </button>


            <p
                id="loginMessage"
                class="form-message"
                aria-live="polite"
            ></p>

        </form>


        <!-- SEPARADOR -->

        <div class="auth-divider">
            <span>ou</span>
        </div>


        <!-- CADASTRO -->

        <div class="register-box">

            <p>
                Ainda não possui uma conta?
            </p>

            <a
                href="cadastro.html"
                class="register-link"
            >
                CRIAR CONTA
                <span>→</span>
            </a>

        </div>


        <!-- VOLTAR -->

        <a
            href="../index.html"
            class="back-link"
        >
            ← Voltar ao website
        </a>

    </section>


    <!-- RODAPÉ -->

    <footer class="auth-footer">

        <span>
            © <span id="year"></span>
            TRADERS DE ELITE
        </span>

        <span>
            Angola
        </span>

    </footer> 

</main>


<!-- APPWRITE -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17"></script>
<script src="../js/appwrite-config.js"></script>
<script src="js/login.js"></script>


</body>
</html>
